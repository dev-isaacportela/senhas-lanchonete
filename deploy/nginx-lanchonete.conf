# nginx-lanchonete.conf — proxy reverso para o backend Node + Socket.io.
#
# Instalar em /etc/nginx/sites-available/lanchonete e criar o link em
# sites-enabled. Trocar SEU_DOMINIO antes de rodar o certbot.
#
# O detalhe que decide se a impressao funciona: proxy_read_timeout.
# O Socket.io mantem a conexao aberta e ociosa entre um pedido e outro, e o
# agente de impressao vive nessa conexao. Com o padrao de 60 segundos, o
# nginx derruba o canal a cada minuto de movimento parado e o agente passa o
# evento reconectando. Foi exatamente esse o risco que matou a opcao Render;
# aqui ele e uma linha de configuracao sua.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name SEU_DOMINIO;

  # O certbot reescreve este arquivo: cria o bloco 443 com o certificado e
  # transforma este aqui no redirecionamento para https.

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # Sem estes dois cabecalhos o websocket nunca sai do polling.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # O KDS da cozinha e a TV de chamada dependem de evento imediato.
    proxy_buffering off;
  }
}
