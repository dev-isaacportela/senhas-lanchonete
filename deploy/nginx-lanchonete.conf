# nginx-lanchonete.conf — proxy reverso para o backend Node + Socket.io.
#
# Instalar em /etc/nginx/sites-available/lanchonete e criar o link em
# sites-enabled. Trocar SEU_DOMINIO antes de rodar o certbot.
#
# Sobre o proxy_read_timeout de 3600s mais abaixo: e margem, nao salvacao.
# O Socket.io manda ping a cada 25s por padrao (pingInterval 25s +
# pingTimeout 20s = 45s), entao a conexao do agente nao fica ociosa tempo
# suficiente para o padrao de 60s do nginx derrubar. A regra e so manter o
# timeout acima desses 45s; 3600s custa nada e cobre quem mexer nos pings
# depois.
#
# O que derruba o agente de verdade e a plataforma parar o processo por
# inatividade — foi isso o spin-down do Render Free, nao timeout de socket.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name SEU_DOMINIO;

  # O certbot reescreve este arquivo: cria o bloco 443 com o certificado e
  # transforma este aqui no redirecionamento para https.

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # Sem estes dois cabecalhos o websocket nunca sai do polling.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # O KDS da cozinha e a TV de chamada dependem de evento imediato.
    proxy_buffering off;
  }
}
